services:
  postgres:
    image: postgres:17-alpine
    container_name: logos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos_dev
      POSTGRES_DB: logos_db
    ports:
      - "5435:5432"
    volumes:
      - logos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  logos_postgres_data:
